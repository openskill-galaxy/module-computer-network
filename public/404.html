<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>OpenSkill Galaxy — 重定向中...</title>
    <script>
      // Single Page Apps for GitHub Pages
      // MIT License https://github.com/rafgraph/spa-github-pages
      const pathSegmentsToKeep = 1;
      const base = location.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/";
      const route = location.pathname.slice(base.length) + location.search + location.hash;
      location.replace(base + "?__osg_route=" + encodeURIComponent(route));
    </script>
  </head>
  <body>
    <div style="font-family: system-ui, sans-serif; text-align: center; padding: 40px; color: #64748b;">
      🌌 OpenSkill Galaxy 页面加载重定向中...
    </div>
  </body>
</html>
