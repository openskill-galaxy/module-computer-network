    <script>
      // Restore deep links from 404.html (?page=path&k=v~and~k2=v2) or Portal (?page=%2Flessons%2F...) before mount
      (function () {
        try {
          var l = window.location;
          var home = "%BASE_URL%";
          if (l.pathname !== home) return;
          var route = new URLSearchParams(l.search).get("__osg_route");
          if (route !== null) {
            var target = new URL(home + route, l.origin);
            if (target.origin === l.origin && target.pathname.startsWith(home)) {
              history.replaceState(null, "", target.pathname + target.search + target.hash);
            }
            return;
          }

          if (!l.search) return;
          var base = "%BASE_URL%";
          if (base.indexOf("BASE_URL") !== -1) base = "/";
          if (!base.endsWith("/")) base += "/";

          var parts = l.search.slice(1).split("&");
          var rawPage = null;
          var restParts = [];
          for (var i = 0; i < parts.length; i++) {
            var part = parts[i];
            if (!part) continue;
            if (part.indexOf("page=") === 0 && rawPage === null) {
              rawPage = part.slice(5);
            } else {
              restParts.push(part.replace(/~and~/g, "&"));
            }
          }
          if (rawPage !== null) {
            var decodedPage = decodeURIComponent(rawPage.replace(/\+/g, " ")).replace(/~and~/g, "&");
            var qIdx = decodedPage.indexOf("?");
            var pagePath = qIdx >= 0 ? decodedPage.slice(0, qIdx) : decodedPage;
            var pageQuery = qIdx >= 0 ? decodedPage.slice(qIdx + 1) : "";
            var cleanPath = pagePath.replace(/^\/+/, "");
            var allQueries = [];
            if (pageQuery) allQueries.push(pageQuery);
            if (restParts.length) allQueries.push(restParts.join("&"));
            var finalSearch = allQueries.length ? "?" + allQueries.join("&") : "";
            window.history.replaceState(null, "", base + cleanPath + finalSearch + l.hash);
          }
        } catch (e) {}
      })();
    </script>
    <script>
      // Set theme before paint to avoid flash (light default)
      (function () {
        try {
          var t = localStorage.getItem("theme") || "light";
          document.documentElement.classList.add(t === "dark" ? "dark" : "light");
        } catch (e) {
          document.documentElement.classList.add("light");
        }
      })();
    </script>
    <script>
      function showUpdateToast() {
        if (document.querySelector('.update-toast')) return;
        const toast = document.createElement('div');
        toast.className = 'update-toast';
        toast.setAttribute('role', 'status');
        toast.setAttribute('aria-live', 'polite');
        toast.innerHTML = `
          <div style="background: var(--surface); backdrop-filter: blur(12px); border: 1px solid var(--border-strong); border-radius: 16px; padding: 16px; box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 12px; width: 100%; box-sizing: border-box; font-family: Inter, system-ui, sans-serif;">
            <span style="font-size: 16px; color: var(--accent-text);">✦</span>
            <div style="flex: 1; min-width: 0;">
              <h4 style="margin: 0; color: var(--text); font-size: 13px; font-weight: 600;">本模块内容已升级</h4>
              <p style="margin: 4px 0 0 0; color: var(--text-muted); font-size: 12px; line-height: 1.4;">新讲义与评测题目已更新，立即刷新体验最新版本。</p>
            </div>
            <button onclick="window.location.reload()" style="background: var(--accent); color: var(--accent-fg); border: 0; padding: 9px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; box-shadow: var(--shadow-accent); font-family: inherit;">重载</button>
            <button onclick="this.closest('.update-toast').remove()" aria-label="关闭" style="background: transparent; color: var(--text-subtle); border: 0; padding: 8px; border-radius: 8px; font-size: 13px; line-height: 1; cursor: pointer; font-family: inherit;">✕</button>
          </div>
        `;
        toast.style.position = 'fixed';
        toast.style.bottom = '16px';
        toast.style.right = '16px';
        toast.style.width = '340px';
        toast.style.maxWidth = 'calc(100vw - 32px)';
        toast.style.zIndex = '99999';
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(10px)';
        toast.style.transition = 'all 0.5s cubic-bezier(0.16, 1, 0.3, 1)';
        document.body.appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = '1';
          toast.style.transform = 'translateY(0)';
        }, 100);
      }

      if ('%MODE%' === 'production' && 'serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          var base = "%BASE_URL%";
          if (base.indexOf("BASE_URL") !== -1) base = "/";
          if (!base.endsWith("/")) base += "/";
          navigator.serviceWorker.register(base + 'sw.js', { scope: base }).then(reg => {
            reg.onupdatefound = () => {
              const installingWorker = reg.installing;
              if (installingWorker) {
                installingWorker.onstatechange = () => {
                  if (installingWorker.state === 'installed') {
                    if (navigator.serviceWorker.controller?.scriptURL === installingWorker.scriptURL) {
                      showUpdateToast();
                    }
                  }
                };
              }
            };
          }).catch(err => {
            console.warn('Service worker registration failed:', err);
          });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
